spring.application.name=library

# --- PostgreSQL: поменяйте пароль на свой ---
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=postgres
spring.datasource.password=1525
spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Правила библиотеки ---
library.loan-days=14
library.fine-per-day=10
library.max-active-loans=5
library.upload-dir=uploads
# Заполнить каталог примерами изданий (после первого запуска можно поставить false)
library.demo-books=false
# Создать 30 тестовых читателей (пароль у всех reader123)
library.demo-readers=false